<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:56px;height:100%;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0 12px;box-sizing:border-box;border-right:1px solid {{ borderCol }};background:{{ railBg }}">
  <div style="width:38px;height:38px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:#09B2C7">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"></circle><path d="M8.4 8.4l7.2 7.2M15.6 8.4l-7.2 7.2"></path></svg>
  </div>
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
    <div style="{{ it.cell }}" title="{{ it.label }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.d }}"></path></svg>
      <sc-if value="{{ it.soon }}" hint-placeholder-val="{{ false }}">
        <span style="{{ soonDot }}"></span>
      </sc-if>
    </div>
  </sc-for>
  <div style="flex:1"></div>
  <div style="{{ settingsCell }}" title="Settings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 4v5M6 13v7M18 4v7M18 15v5M3 11h6M15 13h6"></path></svg>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:56,&quot;height&quot;:520},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;libraries&quot;,&quot;review&quot;,&quot;duplicates&quot;,&quot;export&quot;],&quot;default&quot;:&quot;libraries&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const ITEMS = [
  { id: 'libraries', label: 'Libraries', d: 'M3 7.5A2 2 0 0 1 5 5.5h3.4l2 2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' },
  { id: 'review', label: 'Review', d: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
  { id: 'duplicates', label: 'Duplicates', d: 'M12 3 3 8l9 5 9-5zM3 13l9 5 9-5' },
  { id: 'export', label: 'Export', d: 'M12 4v11M7.5 11l4.5 4.5L16.5 11M4 20h16' },
  { id: 'develop', label: 'Develop — not yet available', soon: true, d: 'M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6.4 6.4l2.1 2.1M15.5 15.5l2.1 2.1M17.6 6.4l-2.1 2.1M8.5 15.5l-2.1 2.1' }
];

class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const active = this.props.active || 'libraries';
    const base = 'position:relative;width:38px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;';
    const idle = base + 'background:transparent;color:' + (dark ? '#ABABAB' : '#5E5E5F');
    const on = base + 'background:' + (dark ? 'rgba(9,178,199,0.18)' : 'rgba(9,178,199,0.12)') + ';color:' + (dark ? '#51D7ED' : '#007A8A');
    const dim = base + 'background:transparent;color:' + (dark ? '#4F5C68' : '#B4B4B4');
    return {
      borderCol: dark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)',
      railBg: dark ? '#121414' : '#FFFFFF',
      settingsCell: idle,
      soonDot: 'position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:9999px;background:' + (dark ? '#4F5C68' : '#C7C6C6'),
      items: ITEMS.map(it => ({
        ...it,
        cell: it.soon ? dim : (active === it.id ? on : idle)
      }))
    };
  }
}
</script>
</body>
</html>
